<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#fdfcf7',
                        surface: '#ffffff',
                        border: '#e4ebf2',
                        'border-strong': '#cfdbe6',
                        text: '#162330',
                        'text-muted': '#5c6c7d',
                        'text-subtle': '#8796a5',
                        brand: '#0077cd',
                        'brand-hover': '#0062b0',
                        'brand-subtle': '#eef6fc',
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fdfcf7;
            color: #162330;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .prose {
            max-width: 720px;
            margin: 0 auto;
            color: #243240;
            font-size: 1.05rem;
            line-height: 1.8;
        }
        .prose h1 {
            font-family: 'Newsreader', serif;
            font-size: 2.35rem;
            font-weight: 500;
            color: #111827;
            letter-spacing: -0.02em;
            line-height: 1.25;
            margin-bottom: 0.75rem;
        }
        .prose h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #162330;
            letter-spacing: -0.015em;
            margin-top: 2.5rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #eef2f6;
        }
        .prose h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #162330;
            margin-top: 1.75rem;
            margin-bottom: 0.5rem;
        }
        .prose p {
            margin-bottom: 1.25rem;
            color: #374756;
        }
        .prose ul {
            list-style: none;
            padding-left: 0;
            margin-bottom: 1.5rem;
        }
        .prose ul li {
            position: relative;
            padding-left: 1.25rem;
            margin-bottom: 0.5rem;
            color: #374756;
        }
        .prose ul li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: #8796a5;
        }
        .prose a {
            color: #0077cd;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .prose a:hover {
            color: #005a9c;
        }
        .prose strong {
            font-weight: 600;
            color: #162330;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dce4ec; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #b8c7d6; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-subtle selection:text-text">

    <!-- Minimalist Clean Header (No buzzwords) -->
    <header class="border-b border-border/80 bg-bg/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="text-sm font-semibold tracking-tight text-text hover:opacity-80 transition">
                Deep Research
            </a>

            <div class="flex items-center gap-4 text-xs">
                <a href="https://cottutom.fr" target="_blank" class="text-text-muted hover:text-text transition">
                    cottutom.fr ↗
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-6 py-10 flex-1 w-full flex flex-col gap-10">

        <!-- Search Bar Section -->
        <section class="max-w-2xl mx-auto w-full">
            <form id="researchForm" class="space-y-3">
                <div class="bg-surface border border-border-strong rounded-2xl p-2 shadow-xs transition-all focus-within:border-brand focus-within:ring-2 focus-within:ring-brand/10">
                    <textarea id="queryInput" rows="2" required
                        class="w-full bg-transparent px-3.5 pt-2 pb-1 text-sm text-text placeholder-text-subtle focus:outline-none resize-none"
                        placeholder="Rechercher un sujet en profondeur..."></textarea>
                    
                    <div class="flex items-center justify-between pt-2 px-2 border-t border-border/60">
                        <input id="clarificationsInput" type="text"
                            class="text-xs bg-transparent text-text-muted placeholder-text-subtle focus:outline-none flex-1 mr-3"
                            placeholder="Consignes précises (optionnel)...">
                        
                        <div class="flex items-center gap-2 shrink-0">
                            <select id="providerSelect" class="bg-transparent text-xs text-text-muted border border-border rounded-lg px-2 py-1 focus:outline-none">
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Claude</option>
                                <option value="google">Gemini</option>
                                <option value="mock" selected>Web Direct</option>
                            </select>

                            <button type="submit" id="submitBtn"
                                class="bg-brand hover:bg-brand-hover text-white text-xs font-medium px-4 py-1.5 rounded-lg transition duration-150 flex items-center gap-1.5 shadow-xs">
                                <span>Rechercher</span>
                                <span class="opacity-70 text-[11px]">↵</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Optional API Key accordion -->
                <div class="flex items-center justify-between px-1 text-[11px] text-text-subtle">
                    <button type="button" onclick="toggleApiKeyInput()" class="hover:text-text-muted transition flex items-center gap-1">
                        <span id="apiKeyToggleLabel">+ Clé API (optionnel)</span>
                    </button>
                </div>
                <div id="apiKeyContainer" class="hidden pt-1">
                    <input id="apiKeyInput" type="password"
                        class="w-full text-xs bg-surface border border-border rounded-xl px-3 py-2 text-text placeholder-text-subtle focus:outline-none focus:border-brand"
                        placeholder="sk-... (laisser vide pour recherche web directe sans clé)">
                </div>
            </form>
        </section>

        <!-- Progress Timeline (Minimal, appears during search) -->
        <section id="progressSection" class="hidden max-w-2xl mx-auto w-full">
            <div class="bg-surface border border-border rounded-xl p-4">
                <div class="flex items-center justify-between mb-3 text-xs">
                    <span class="font-medium text-text">Recherche en cours</span>
                    <span id="progressTime" class="text-text-subtle font-mono text-[11px]">00:00</span>
                </div>

                <div class="grid grid-cols-4 gap-2 text-center text-xs">
                    <div id="stepPlanner" class="py-2 px-1 rounded-lg border border-border bg-bg text-text-muted transition-colors">
                        <div class="text-[10px] text-text-subtle uppercase tracking-wider mb-0.5">01</div>
                        <div class="font-medium text-[11px]">Planification</div>
                    </div>
                    <div id="stepResearcher" class="py-2 px-1 rounded-lg border border-border bg-bg text-text-muted transition-colors">
                        <div class="text-[10px] text-text-subtle uppercase tracking-wider mb-0.5">02</div>
                        <div class="font-medium text-[11px]">Exploration Web</div>
                    </div>
                    <div id="stepCritic" class="py-2 px-1 rounded-lg border border-border bg-bg text-text-muted transition-colors">
                        <div class="text-[10px] text-text-subtle uppercase tracking-wider mb-0.5">03</div>
                        <div class="font-medium text-[11px]">Vérification</div>
                    </div>
                    <div id="stepWriter" class="py-2 px-1 rounded-lg border border-border bg-bg text-text-muted transition-colors">
                        <div class="text-[10px] text-text-subtle uppercase tracking-wider mb-0.5">04</div>
                        <div class="font-medium text-[11px]">Synthèse</div>
                    </div>
                </div>

                <p id="liveStatusMsg" class="mt-3 text-xs text-text-muted flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-brand animate-pulse"></span>
                    <span id="liveStatusText">Démarrage...</span>
                </p>
            </div>
        </section>

        <!-- Results Viewport -->
        <section id="resultsSection" class="w-full">
            
            <div id="resultTabs" class="hidden max-w-2xl mx-auto flex items-center justify-between border-b border-border pb-2 mb-8 text-xs">
                <div class="flex items-center gap-6">
                    <button onclick="switchTab('report')" id="tabBtnReport" class="font-semibold text-brand pb-2 -mb-2.5 border-b-2 border-brand transition">
                        Rapport
                    </button>
                    <button onclick="switchTab('plan')" id="tabBtnPlan" class="text-text-muted hover:text-text pb-2 -mb-2.5 transition">
                        Plan d'étude
                    </button>
                    <button onclick="switchTab('critic')" id="tabBtnCritic" class="text-text-muted hover:text-text pb-2 -mb-2.5 transition">
                        Vérification
                    </button>
                    <button onclick="switchTab('sources')" id="tabBtnSources" class="text-text-muted hover:text-text pb-2 -mb-2.5 transition">
                        Sources (<span id="sourceCount">0</span>)
                    </button>
                </div>
                
                <button onclick="downloadReport()" id="exportBtn" class="text-text-muted hover:text-text text-xs flex items-center gap-1 transition">
                    <span>Exporter .md</span>
                </button>
            </div>

            <!-- View 1: Main Report -->
            <div id="viewReport" class="w-full">
                <div id="reportContent" class="prose"></div>
            </div>

            <!-- View 2: Research Plan -->
            <div id="viewPlan" class="hidden max-w-2xl mx-auto space-y-4">
                <div id="planContent" class="space-y-4"></div>
            </div>

            <!-- View 3: Critic Review -->
            <div id="viewCritic" class="hidden max-w-2xl mx-auto space-y-4">
                <div id="criticContent" class="space-y-4"></div>
            </div>

            <!-- View 4: Sources -->
            <div id="viewSources" class="hidden max-w-2xl mx-auto space-y-3">
                <div id="sourcesContent" class="space-y-2"></div>
            </div>

        </section>

    </main>

    <!-- Footer (Clean & Discreet) -->
    <footer class="border-t border-border py-6 text-center text-xs text-text-subtle">
        <div class="max-w-5xl mx-auto px-6 flex items-center justify-between">
            <span>Deep Research</span>
            <span class="text-[11px] text-text-subtle">cottutom.fr</span>
        </div>
    </footer>

    <!-- Frontend Logic -->
    <script>
        let currentReportMarkdown = "";
        let timerInterval = null;
        let startTimestamp = null;

        function toggleApiKeyInput() {
            const container = document.getElementById('apiKeyContainer');
            const label = document.getElementById('apiKeyToggleLabel');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                label.innerText = '− Masquer clé API';
            } else {
                container.classList.add('hidden');
                label.innerText = '+ Clé API (optionnel)';
            }
        }

        function switchTab(tab) {
            ['report', 'plan', 'critic', 'sources'].forEach(t => {
                const btn = document.getElementById('tabBtn' + t.charAt(0).toUpperCase() + t.slice(1));
                const view = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    btn.className = "font-semibold text-brand pb-2 -mb-2.5 border-b-2 border-brand transition";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "text-text-muted hover:text-text pb-2 -mb-2.5 transition";
                    view.classList.add('hidden');
                }
            });
        }

        function setStepActive(stepId, isActive, isDone) {
            const el = document.getElementById(stepId);
            if (isActive) {
                el.className = "py-2 px-1 rounded-lg border border-brand bg-brand-subtle text-brand font-medium transition-colors";
            } else if (isDone) {
                el.className = "py-2 px-1 rounded-lg border border-border bg-surface text-text font-medium transition-colors";
            } else {
                el.className = "py-2 px-1 rounded-lg border border-border bg-bg text-text-subtle transition-colors";
            }
        }

        document.getElementById('researchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const query = document.getElementById('queryInput').value;
            const clarifications = document.getElementById('clarificationsInput').value;
            const provider = document.getElementById('providerSelect').value;
            const apiKey = document.getElementById('apiKeyInput').value;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Recherche...';

            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('resultTabs').classList.add('hidden');
            document.getElementById('reportContent').innerHTML = '';

            // Start timer
            startTimestamp = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsedSec = Math.floor((Date.now() - startTimestamp) / 1000);
                const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
                const s = String(elapsedSec % 60).padStart(2, '0');
                document.getElementById('progressTime').innerText = `${m}:${s}`;
            }, 1000);

            try {
                const res = await fetch('/api/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        clarifications: clarifications,
                        llm_provider: provider,
                        api_key: apiKey || null,
                        max_iterations: 3
                    })
                });

                const job = await res.json();
                const jobId = job.job_id;

                const eventSource = new EventSource(`/api/research/${jobId}/events`);

                eventSource.onmessage = (ev) => {
                    const data = JSON.parse(ev.data);
                    if (data.type === 'final_status') {
                        eventSource.close();
                        clearInterval(timerInterval);
                        finalizeJob(jobId);
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'Rechercher ↵';
                        return;
                    }

                    if (data.message) {
                        document.getElementById('liveStatusText').innerText = data.message;
                    }

                    if (data.agent.includes("Planner")) {
                        setStepActive('stepPlanner', true, false);
                        setStepActive('stepResearcher', false, false);
                    } else if (data.agent.includes("Researcher")) {
                        setStepActive('stepPlanner', false, true);
                        setStepActive('stepResearcher', true, false);
                    } else if (data.agent.includes("Critic")) {
                        setStepActive('stepResearcher', false, true);
                        setStepActive('stepCritic', true, false);
                    } else if (data.agent.includes("Writer")) {
                        setStepActive('stepCritic', false, true);
                        setStepActive('stepWriter', true, false);
                    }
                };

                eventSource.onerror = () => {
                    eventSource.close();
                    clearInterval(timerInterval);
                    finalizeJob(jobId);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Rechercher ↵';
                };

            } catch (err) {
                alert("Erreur: " + err);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Rechercher ↵';
            }
        });

        async function finalizeJob(jobId) {
            setStepActive('stepPlanner', false, true);
            setStepActive('stepResearcher', false, true);
            setStepActive('stepCritic', false, true);
            setStepActive('stepWriter', false, true);

            document.getElementById('liveStatusText').innerText = "Synthèse finalisée.";

            const res = await fetch(`/api/research/${jobId}`);
            const data = await res.json();

            document.getElementById('resultTabs').classList.remove('hidden');

            // Render Markdown Report
            if (data.final_report) {
                currentReportMarkdown = data.final_report.full_markdown || data.final_report.executive_summary;
                document.getElementById('reportContent').innerHTML = marked.parse(currentReportMarkdown);
            }

            // Render Plan
            if (data.plan) {
                const planDiv = document.getElementById('planContent');
                let html = `<div class="p-4 bg-surface border border-border rounded-xl"><p class="text-xs font-semibold text-text mb-1">Objectif de recherche</p><p class="text-xs text-text-muted leading-relaxed">${data.plan.research_objective}</p></div>`;
                data.plan.subtasks.forEach((st, i) => {
                    html += `
                    <div class="p-4 bg-surface border border-border rounded-xl space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-text">${i+1}. ${st.title}</span>
                            <span class="text-[10px] text-text-subtle font-mono">${st.id}</span>
                        </div>
                        <p class="text-xs text-text-muted">${st.description}</p>
                        <div class="flex flex-wrap gap-1 pt-1">
                            ${st.target_search_queries.map(q => `<span class="px-2 py-0.5 bg-bg text-[11px] text-text-muted border border-border rounded font-mono">${q}</span>`).join('')}
                        </div>
                    </div>`;
                });
                planDiv.innerHTML = html;
            }

            // Render Critic
            if (data.critic_reviews && data.critic_reviews.length > 0) {
                const criticDiv = document.getElementById('criticContent');
                let html = "";
                data.critic_reviews.forEach((cr, i) => {
                    html += `
                    <div class="p-4 bg-surface border border-border rounded-xl space-y-2">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-semibold text-text">Vérification des faits ${i+1} : ${cr.verdict}</span>
                            <span class="text-text-muted font-mono">Score : ${cr.completeness_score}%</span>
                        </div>
                        <p class="text-xs text-text-muted leading-relaxed">${cr.reasoning}</p>
                    </div>`;
                });
                criticDiv.innerHTML = html;
            }

            // Render Sources
            if (data.final_report && data.final_report.bibliography) {
                const sourcesDiv = document.getElementById('sourcesContent');
                document.getElementById('sourceCount').innerText = data.final_report.bibliography.length;
                let html = "";
                data.final_report.bibliography.forEach(src => {
                    html += `
                    <div class="p-3 bg-surface border border-border rounded-xl flex items-start justify-between gap-4 text-xs">
                        <div>
                            <p class="font-medium text-text">[${src.id}] <a href="${src.url}" target="_blank" class="hover:underline text-brand">${src.title}</a></p>
                            <p class="text-text-muted text-[11px] mt-0.5">${src.snippet}</p>
                        </div>
                        <span class="text-[10px] font-mono text-text-subtle shrink-0">${src.domain}</span>
                    </div>`;
                });
                sourcesDiv.innerHTML = html;
            }
        }

        function downloadReport() {
            if (!currentReportMarkdown) return;
            const blob = new Blob([currentReportMarkdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `deep_research_report.md`;
            a.click();
        }
    </script>
</body>
</html>
