[project]
name = "multi-agent-deep-research"
version = "0.1.0"
description = "Autonomous Multi-Agent Deep Research & Synthesizer system with LangGraph, Reflection loop, and Rich/FastAPI interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.8",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "trafilatura>=2.0.0",
    "duckduckgo-search>=7.2.1",
    "tavily-python>=0.5.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
